[package]
name = "rusty_genes"
description = "A library for implementing and executing evolutionary algorithms with customizable models."
authors = ["Kambiz Khojasteh"]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Khojasteh/rusty_genes"
documentation = "https://docs.rs/rusty_genes"

[dependencies]
rayon = "1.12.0"
rand = "0.10.3"
rand_core_0_10 = { package = "rand_core", version = "0.10.1", optional = true }

[features]
# Implements the random number generator traits of rand 0.10 for `Rng`.
rand-0_10 = ["dep:rand_core_0_10"]

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false
